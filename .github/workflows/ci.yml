name: InfluencedX deterministic CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: influencedx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  protocol:
    name: GenLayer V2 plus historical protocol regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-direct.txt
      - run: npm ci
      - run: python -m pip install --requirement requirements-direct.txt
      - run: genvm-lint check contracts/genlayer/InfluencedXMarketplace.py --json
      - run: python -m pytest tests/direct -q
      - name: Historical regression - compile retired Solidity contracts
        run: npm run contracts:compile
      - name: Historical regression - Base contract tests
        run: npm run test:base
      - name: Historical regression - watcher relay tests
        run: npm run test:relay
      - name: Historical regression - retired operator scripts
        run: npm run test:operator
      - name: Historical regression - retired service scripts
        run: node --test tests/services/*.test.mjs
      - name: Historical regression - APV2 submitter
        run: npm run test:submitter

  web:
    name: Web lint, build, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  hosted-services:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Historical regression - APV2 submitter
            directory: services/vercel-bradbury-submitter
          - name: Historical regression - Base campaign relay
            directory: services/vercel-campaign-relay
          - name: Historical regression - Base campaign watcher
            directory: services/vercel-campaign-watcher
          - name: GenLayer marketplace operator
            directory: services/vercel-genlayer-marketplace-operator
          - name: GenLayer withdrawal reconciler
            directory: services/vercel-genlayer-withdrawal-reconciler
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: npm run lint
        working-directory: ${{ matrix.directory }}
      - run: npm run build
        working-directory: ${{ matrix.directory }}
      - run: npm test
        working-directory: ${{ matrix.directory }}

# Deliberately excluded: public-X stress, live RPC verification, migrations,
# deployments, watcher signing, relayer broadcasts, and every secret-bearing
# operator command. Those require explicit environment-specific workflows.
