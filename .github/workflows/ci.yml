name: InfluencedX deterministic CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: influencedx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  protocol:
    name: Protocol and relay tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run contracts:compile
      - run: npm run test:base
      - run: npm run test:relay
      - run: npm run test:operator
      - run: npm run test:services
      - run: npm run test:submitter

  web:
    name: Web lint, build, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  hosted-services:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Bradbury submitter
            directory: services/vercel-bradbury-submitter
          - name: Campaign settlement relay
            directory: services/vercel-campaign-relay
          - name: Campaign watcher
            directory: services/vercel-campaign-watcher
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: npm run lint
        working-directory: ${{ matrix.directory }}
      - run: npm run build
        working-directory: ${{ matrix.directory }}
      - run: npm test
        working-directory: ${{ matrix.directory }}

# Deliberately excluded: public-X stress, live RPC verification, migrations,
# deployments, watcher signing, relayer broadcasts, and every secret-bearing
# operator command. Those require explicit environment-specific workflows.
